<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-4">

        <h1 class="text-center mb-4">Student Admission System</h1>

        <!-- ================= Admission Form ================= -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" id="formHeading">Student Admission Form</h5>
            </div>
            <div class="card-body">
                <form id="studentForm" novalidate>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="studentId" class="form-label">Student ID</label>
                            <input type="text" class="form-control" id="studentId"
                                   placeholder="Auto-generated" readonly>
                        </div>

                        <div class="col-md-6">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>

                        <div class="col-md-6">
                            <label for="dob" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" required>
                        </div>

                        <div class="col-md-6">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" required>
                        </div>

                        <div class="col-md-6">
                            <label for="course" class="form-label">Course</label>
                            <select class="form-select" id="course" required>
                                <option value="">Select Course</option>
                                <option value="B.Tech CSE">Computer Science Engineering</option>
                                <option value="B.Tech ECE">Electronics &amp; Communication</option>
                                <option value="B.Tech EEE">Electrical Engineering</option>
                                <option value="B.Tech MECH">Mechanical Engineering</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="percentage" class="form-label">12th Percentage</label>
                            <input type="number" class="form-control" id="percentage"
                                   step="0.01" min="0" max="100" required>
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" rows="2" required></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="guardianName" class="form-label">Guardian Name</label>
                            <input type="text" class="form-control" id="guardianName" required>
                        </div>

                        <div class="col-md-6">
                            <label for="guardianPhone" class="form-label">Guardian Phone</label>
                            <input type="text" class="form-control" id="guardianPhone" required>
                        </div>

                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary" id="submitButton">Add Student</button>
                        <button type="reset" class="btn btn-secondary" id="clearButton">Clear</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ================= Student Records ================= -->
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Student Records</h5>
            </div>
            <div class="card-body">

                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="searchInput"
                           placeholder="Search student...">
                    <button class="btn btn-outline-primary" type="button" id="searchButton">Search</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody"></tbody>
                    </table>
                </div>

            </div>
        </div>

        <!-- ================= Student Details: subjects, hostel, marks ================= -->
        <div class="card mt-4" id="detailsCard">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Student Details: Subjects, Hostel &amp; Marks</h5>
            </div>
            <div class="card-body">

                <!-- Search by ID (or click "Details" on a row in the table above) -->
                <div class="input-group mb-3">
                    <input type="number" class="form-control" id="detailsSearchId"
                           placeholder="Enter Student ID, or click Details in the table">
                    <button class="btn btn-success" type="button" id="detailsSearchBtn">Show Details</button>
                </div>

                <!-- Add to the master lists -->
                <details class="mb-3">
                    <summary>Add a new subject or hostel to the lists</summary>
                    <div class="row g-2 mt-1">
                        <div class="col-md-6 input-group">
                            <input id="newSubject" class="form-control" placeholder="New subject name">
                            <button id="addSubjectBtn" class="btn btn-outline-secondary" type="button">Add subject</button>
                        </div>
                        <div class="col-md-6 input-group">
                            <input id="newHostel" class="form-control" placeholder="New hostel name">
                            <button id="addHostelBtn" class="btn btn-outline-secondary" type="button">Add hostel</button>
                        </div>
                    </div>
                </details>

                <!-- Filled in when a student is selected -->
                <div id="detailsResult" class="d-none">

                    <h6 class="border-bottom pb-1">Profile</h6>
                    <dl id="detailsProfile" class="row mb-4"></dl>

                    <h6 class="border-bottom pb-1">Hostel (one hostel, room and bed per student)</h6>
                    <p id="hostelText" class="mb-2"></p>
                    <div class="row g-2 mb-4">
                        <div class="col-md-4"><select id="hostelSelect" class="form-select"></select></div>
                        <div class="col-md-3"><input id="roomNo" class="form-control" placeholder="Room no"></div>
                        <div class="col-md-3"><input id="bedNo" type="number" min="1" class="form-control" placeholder="Bed no"></div>
                        <div class="col-md-2"><button id="allocateBtn" class="btn btn-success w-100" type="button">Save</button></div>
                    </div>

                    <h6 class="border-bottom pb-1">Subjects</h6>
                    <div id="subjectList" class="mb-2"></div>
                    <div class="row g-2 mb-4">
                        <div class="col-md-10"><select id="subjectSelect" class="form-select"></select></div>
                        <div class="col-md-2"><button id="addStudentSubjectBtn" class="btn btn-success w-100" type="button">Add</button></div>
                    </div>

                    <h6 class="border-bottom pb-1">Marks</h6>
                    <table class="table table-sm">
                        <thead><tr><th>Subject</th><th>Marks</th><th>Year</th><th>Result</th></tr></thead>
                        <tbody id="marksBody"></tbody>
                    </table>
                    <div class="row g-2">
                        <div class="col-md-4"><select id="markSubject" class="form-select"></select></div>
                        <div class="col-md-3"><input id="markValue" type="number" min="0" max="100" step="0.01" class="form-control" placeholder="Marks (0-100)"></div>
                        <div class="col-md-3"><input id="markYear" type="number" class="form-control" placeholder="Year"></div>
                        <div class="col-md-2"><button id="addMarkBtn" class="btn btn-success w-100" type="button">Save</button></div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script src="details.js"></script>
</body>
</html>
